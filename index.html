<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>СОS — ТТН</title>
  <style>body{font-family:Arial,sans-serif;padding:24px;color:#173b67}.msg{padding:16px;border:1px solid #ccd7e3;border-radius:8px;background:#f7fbff}</style>
</head>
<body>
  <div class="msg" id="msg">Открываем накладную СОS…</div>
  <script>
    const WEB_APP = 'https://script.google.com/macros/s/AKfycbwDeaPRSxOJC6AtNBkNYyWMYzczn3wROHMoU2oTEKBs6tCphP79evdPP-YNRitb-8oh/exec';
    const params = new URLSearchParams(window.location.search);
    const docId = String(params.get('doc') || '').trim();
    const print = String(params.get('print') || '').trim();

    if (!/^SOS-WH-\d{8}-\d{6}$/.test(docId)) {
      document.getElementById('msg').textContent = 'Некорректный ID накладной.';
    } else {
      let url = WEB_APP + '?view=1&doc=' + encodeURIComponent(docId) + '&legacy=github';
      if (print === '1') url += '&print=1';
      window.location.replace(url);
    }
  </script>
</body>
</html>
